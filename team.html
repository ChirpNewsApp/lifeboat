<style>
/* Shared look for the pricing and vault pages. Colors and fonts match the home page. */
:root{
  --bg:#E6F0F1; --surface:#F7FBFB; --ink:#0A3340; --muted:#4A6B74;
  --line:#BFD5D8; --signal:#FF5B2E; --signal-ink:#ffffff; --ok:#1C8A5B; --bad:#C2321B;
  --tint:#D3E6E8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A2630; --surface:#10343F; --ink:#E6F3F4; --muted:#93B3BA;
    --line:#22505D; --signal:#FF7248; --signal-ink:#1A0A05; --ok:#4CCB93; --bad:#FF8A73;
    --tint:#17414E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-0.025em}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:-0.02em}
h3{font-size:22px;font-weight:700}
p{margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0}
.logo{display:inline-block;text-decoration:none}
.logo svg{height:40px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:10px}
.navlink{font-weight:600;text-decoration:none;padding:8px 6px}
.navlink:hover{text-decoration:underline;text-underline-offset:4px}

/* buttons */
.btn{display:inline-block;background:var(--signal);color:var(--signal-ink);font:600 16px "Instrument Sans",sans-serif;border:2px solid var(--signal);border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.block{display:block;width:100%}
.btn[disabled],.btn.off{opacity:.55;cursor:default;filter:none}

/* cards */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:24px}
.card.lift{box-shadow:8px 8px 0 var(--ink)}

footer{padding:36px 0 50px;color:var(--muted);font-size:14px;border-top:2px solid var(--line);margin-top:70px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{margin-right:14px}

/* pricing */
.p-hero{padding:34px 0 26px}
.p-hero p{font-size:20px;color:var(--muted);max-width:32em;margin-top:16px}
.gate{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--tint);border:2px solid var(--ink);border-radius:14px;padding:16px 20px;margin:6px 0 30px}
.gate strong{font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.gate .row{display:flex;gap:10px;flex-wrap:wrap}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--ink);border-radius:18px}
.plan.pick{box-shadow:8px 8px 0 var(--ink)}
.plan .flag{position:absolute;top:-15px;left:18px;background:var(--signal);color:var(--signal-ink);font-weight:600;font-size:14px;padding:4px 14px;border-radius:99px;border:2px solid var(--ink)}
.plan .head{padding:26px 22px 6px}
.price{font:800 44px "Bricolage Grotesque",sans-serif;letter-spacing:-0.02em;margin-top:6px}
.price small{font:600 17px "Instrument Sans",sans-serif;color:var(--muted);letter-spacing:0}
.space{margin:14px 22px 0;padding:14px 16px;background:var(--tint);border-radius:12px}
.space b{display:block;font:800 34px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-0.02em}
.space span{font-size:14px;color:var(--muted)}
.plan ul{list-style:none;margin:16px 22px 0;padding:0;font-size:15.5px;flex:1}
.plan li{display:flex;gap:10px;margin:7px 0}
.plan li:before{content:"\2713";flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;background:var(--ok);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.plan .foot{padding:18px 22px 22px}
.note{margin-top:22px;min-height:1.5em;font-weight:600}
.note.ok{color:var(--ok)}
.fine{margin-top:30px;color:var(--muted);font-size:15px;max-width:44em}

/* vault */
.v-head{padding:30px 0 22px}
.v-head p{margin-top:12px;color:var(--muted);font-size:19px}
.v-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.gauge{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.gauge svg{width:210px;height:210px;flex:none}
.gauge .read{flex:1 1 150px;min-width:150px}
.gauge .read b{display:block;font:800 40px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-0.02em}
.gauge .read span{color:var(--muted)}
.gauge .read p{margin-top:14px;font-size:15px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:2px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv strong{text-align:right;word-break:break-word}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sec{margin-top:44px}
.sec>p{margin-top:8px;color:var(--muted);max-width:38em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-top:20px}
.tile{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:18px}
.tile svg{flex:none;width:34px;height:34px;color:var(--signal)}
.tile b{display:block;font:700 19px "Bricolage Grotesque",sans-serif}
.tile span{font-size:14.5px;color:var(--muted)}
.tile div>span:not(.soon){display:block;line-height:1.4;margin-top:3px}
.soon{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--muted);border:2px solid var(--line);border-radius:99px;padding:1px 10px}
.skeleton{opacity:.5}

@media (max-width:820px){
  .v-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .navlink{display:none}
  .btn{padding:10px 14px;font-size:15px}
  .logo svg{height:34px}
  .gauge{justify-content:center;text-align:center}
  .gauge .read p{margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* team page */
body{font-variant-ligatures:no-contextual;font-feature-settings:"calt" 0}
.t-hero{padding:30px 0 26px;max-width:40em}
.t-hero h1{font-size:clamp(40px,6.4vw,68px);font-weight:800;letter-spacing:-.025em}
.t-hero p{font-size:19px;color:var(--muted);margin-top:12px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding-bottom:20px}
.person{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:flex-start}
.person .ph{width:112px;height:112px;border-radius:50%;overflow:hidden;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 42px "Bricolage Grotesque",sans-serif;text-transform:uppercase;box-shadow:5px 5px 0 var(--signal);margin-bottom:18px}
.person .ph img{width:100%;height:100%;object-fit:cover;display:block}
.person h2{font-size:23px;letter-spacing:-.01em;overflow-wrap:anywhere}
.person .role{font-weight:600;color:var(--signal);margin-top:3px}
.person .bio{color:var(--muted);margin-top:10px;font-size:15.5px;overflow-wrap:anywhere}
.person .adm{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:16px}
.mini{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font:600 13.5px "Instrument Sans",sans-serif;cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini.del{color:var(--bad)}
.mini.del.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.mini[disabled]{opacity:.4;cursor:default}
.t-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.t-form{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:22px;max-width:640px}
.t-form h2{font-size:21px;margin-bottom:12px}
.t-form label{display:block;font-weight:600;font-size:14.5px;margin:10px 0 5px}
.t-form input[type=text],.t-form textarea{width:100%;font:inherit;font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.t-form input:focus,.t-form textarea:focus{border-color:var(--ink);outline:none}
.t-form textarea{min-height:80px;resize:vertical}
.t-form .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.t-form .pic{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.t-form .pic .ph{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 24px "Bricolage Grotesque",sans-serif}
.t-form .pic .ph img{width:100%;height:100%;object-fit:cover}
.t-form .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn.small{padding:7px 12px;font-size:14.5px}
.linkish{background:none;border:0;color:var(--bad);font-weight:600;cursor:pointer;font-size:14.5px}
.t-msg{min-height:1.4em;margin-bottom:12px;font-weight:600;font-size:14.5px}
.t-msg.bad{color:var(--bad)} .t-msg.ok{color:var(--ok)}
.t-empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:2px dashed var(--line);border-radius:16px}
@media (max-width:560px){.t-form .two{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var members = [], admin = false, editing = null, newPic = null, picChanged = false;
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
  function say(text, kind){ var m = $('tmsg'); m.textContent = text || ''; m.className = 't-msg' + (kind ? ' ' + kind : ''); }
  async function api(action, extra){
    var headers = { 'Content-Type': 'application/json' };
    if(window.Clerk && Clerk.session){ try { headers.Authorization = 'Bearer ' + await Clerk.session.getToken(); } catch(e){} }
    var r = await fetch('/api/team', { method: 'POST', headers: headers, body: JSON.stringify(Object.assign({ action: action }, extra || {})) });
    var d = {}; try { d = await r.json(); } catch(e){}
    if(!r.ok || !d.ok) throw new Error(d.error || 'Something went wrong. Try again.');
    return d;
  }
  function photo(m, cls){
    var p = el('span', cls || 'ph');
    if(m.photo){ var im = el('img'); im.src = m.photo; im.alt = ''; im.addEventListener('error', function(){ p.textContent = (m.name || '?')[0]; }); p.appendChild(im); }
    else p.textContent = (m.name || '?')[0];
    return p;
  }
  function delBtn(m){
    var b = el('button', 'mini del', 'Remove'); b.type = 'button'; var t = null;
    b.addEventListener('click', async function(){
      if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Yes, remove'; t = setTimeout(function(){ b.classList.remove('armed'); b.textContent = 'Remove'; }, 5000); return; }
      clearTimeout(t); b.disabled = true;
      try { var d = await api('delete', { id: m.id }); members = d.members; draw(); say('Removed ' + m.name + '.', 'ok'); } catch(err){ b.disabled = false; say(err.message, 'bad'); }
    });
    return b;
  }
  function draw(){
    var g = $('grid'); g.textContent = '';
    if(!members.length){ g.appendChild(el('p', 't-empty', admin ? 'No one here yet. Press Add team member to start.' : 'The team page is coming soon.')).style.gridColumn = '1/-1'; return; }
    members.forEach(function(m, i){
      var c = el('article', 'person');
      c.appendChild(photo(m)); c.appendChild(el('h2', '', m.name)); c.appendChild(el('p', 'role', m.role));
      if(m.bio) c.appendChild(el('p', 'bio', m.bio));
      if(admin){
        var a = el('div', 'adm');
        var up = el('button', 'mini', '←'); up.type = 'button'; up.title = 'Move earlier'; up.setAttribute('aria-label', 'Move ' + m.name + ' earlier'); up.disabled = i === 0;
        var dn = el('button', 'mini', '→'); dn.type = 'button'; dn.title = 'Move later'; dn.setAttribute('aria-label', 'Move ' + m.name + ' later'); dn.disabled = i === members.length - 1;
        up.addEventListener('click', function(){ move(m, -1); }); dn.addEventListener('click', function(){ move(m, 1); });
        var ed = el('button', 'mini', 'Edit'); ed.type = 'button'; ed.addEventListener('click', function(){ openForm(m); });
        a.appendChild(up); a.appendChild(dn); a.appendChild(ed); a.appendChild(delBtn(m)); c.appendChild(a);
      }
      g.appendChild(c);
    });
  }
  async function move(m, dir){ try { var d = await api('move', { id: m.id, dir: dir }); members = d.members; draw(); } catch(err){ say(err.message, 'bad'); } }

  // ---- add / edit form (admins) ----
  function setPreview(url, name){ var p = $('t-ph'); p.textContent = ''; if(url){ var im = el('img'); im.src = url; im.alt = ''; p.appendChild(im); } else p.textContent = (name || '?')[0]; $('t-clear').hidden = !url; }
  function openForm(m){
    editing = m || null; newPic = null; picChanged = false;
    $('tform').hidden = false; $('tform-h').textContent = m ? 'Edit ' + m.name : 'Add team member';
    $('t-name').value = m ? m.name : ''; $('t-role').value = m ? m.role : ''; $('t-bio').value = m ? m.bio : '';
    setPreview(m ? m.photo : '', m ? m.name : '?'); $('t-name').focus(); say('');
  }
  $('addbtn').addEventListener('click', function(){ openForm(null); });
  $('t-cancel').addEventListener('click', function(){ $('tform').hidden = true; editing = null; });
  $('t-pick').addEventListener('click', function(){ $('t-file').click(); });
  $('t-clear').addEventListener('click', function(){ newPic = null; picChanged = true; setPreview('', $('t-name').value); });
  // Crop to a centered square and shrink before uploading.
  function square(file, size){
    return new Promise(function(resolve, reject){
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        var m = Math.min(img.naturalWidth, img.naturalHeight), s = Math.min(size, m);
        var c = document.createElement('canvas'); c.width = s; c.height = s;
        c.getContext('2d').drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, s, s);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? resolve(b) : reject(new Error('Could not read that picture.')); }, 'image/jpeg', 0.88);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('That file is not a picture this browser can read.')); };
      img.src = url;
    });
  }
  $('t-file').addEventListener('change', async function(){
    var f = this.files[0]; this.value = ''; if(!f) return;
    try { newPic = await square(f, 600); picChanged = true; setPreview(URL.createObjectURL(newPic), $('t-name').value); } catch(err){ say(err.message, 'bad'); }
  });
  $('tform').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = $('t-save'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var extra = { name: $('t-name').value, role: $('t-role').value, bio: $('t-bio').value };
      if(editing) extra.id = editing.id;
      if(picChanged){
        if(newPic){
          var link = await api('photo-url', { type: 'image/jpeg', size: newPic.size });
          var r = await fetch(link.url, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: newPic });
          if(!r.ok) throw new Error('The picture upload was refused (' + r.status + ').');
          extra.photo = link.key;
        } else extra.photo = '';
      }
      var d = await api('save', extra);
      members = d.members; draw(); $('tform').hidden = true; say((editing ? 'Saved ' : 'Added ') + extra.name.trim() + '.', 'ok'); editing = null;
    } catch(err){ say(err.message, 'bad'); }
    btn.disabled = false; btn.textContent = 'Save';
  });

  // Show the team straight away, then check for admin once login has loaded.
  fetch('/api/team', { headers: { Accept: 'application/json' } }).then(function(r){ return r.json(); }).then(function(d){ if(d && d.ok && !admin){ members = d.members; draw(); } }).catch(function(){});
  LB.ready.then(async function(){
    if(!LB.signedIn) return;
    try { var d = await api('list'); admin = !!(d.me && d.me.admin); members = d.members; $('adminbar').hidden = !admin; draw(); } catch(e){}
  }).catch(function(){});
})();
</script>
</body>
</html>
